name: Deploy Creative Experience to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare static Pages site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';

          const check = (file, reference) => {
            const clean = decodeURIComponent(reference.split(/[?#]/, 1)[0]);
            if (!clean || /^(?:[a-z]+:|\/\/|#)/i.test(clean)) return;
            const target = path.resolve(path.dirname(file), clean);
            if (!existsSync(target)) throw new Error(`Missing local asset: ${file} -> ${reference}`);
          };

          const html = readFileSync('index.html', 'utf8');
          for (const [, reference] of html.matchAll(/(?:src|href)=["']([^"']+)["']/g)) {
            check('index.html', reference);
          }

          const inspectCss = directory => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) inspectCss(file);
              else if (entry.isFile() && file.endsWith('.css')) {
                const css = readFileSync(file, 'utf8');
                for (const [, reference] of css.matchAll(/url\(\s*["']?([^)"']+)["']?\s*\)/g)) {
                  check(file, reference.trim());
                }
              }
            }
          };
          inspectCss('assets');
          NODE

          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          if [ -f La_Basil_Green_Care_Cards.pdf ]; then
            cp La_Basil_Green_Care_Cards.pdf _site/
          fi
          echo 'SITE_DIR=_site' >> "$GITHUB_ENV"
          echo 'Prepared static HTML, CSS, JavaScript, images, fonts, and care guide.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
